spring:
  application:
    name: help-desk
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

auth:
  jwt:
    secret-key: ${JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG

minio:
  url: http://localhost:9000
  access:
    key: ${MINIO_USER:admin}
  secret:
    key: ${MINIO_PASSWORD:password123}
  bucket:
    name: help-desk-avatars