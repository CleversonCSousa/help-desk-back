services:
  api:
    build: .
    container_name: "help-desk-api"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME}
    depends_on:
      - database
    networks:
      - help_desk_network

  database:
    image: postgres:16-alpine
    container_name: help-desk_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - help_desk_network
networks:
  help_desk_network:
    driver: bridge

volumes:
  postgres_data:
